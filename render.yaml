services:
  - type: web
    name: nirikshan-backend
    runtime: docker
    region: singapore
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: NIRIKSHAN_CV_BACKEND_PROCESSING_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: NIRIKSHAN_JWT_SECRET
        generateValue: true
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_SEED_FORCE_RESET
        value: "false"
      - key: NIRIKSHAN_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
