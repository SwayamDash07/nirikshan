spring:
  application:
    name: nirikshan
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  profiles:
    default: local-postgres
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${NIRIKSHAN_DB_POOL_MAX:3}
      minimum-idle: ${NIRIKSHAN_DB_POOL_MIN:1}
      connection-timeout: ${NIRIKSHAN_DB_CONNECTION_TIMEOUT_MS:10000}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${NIRIKSHAN_TOMCAT_MAX_THREADS:20}
      min-spare: ${NIRIKSHAN_TOMCAT_MIN_SPARE_THREADS:2}
    max-connections: ${NIRIKSHAN_TOMCAT_MAX_CONNECTIONS:100}
    accept-count: ${NIRIKSHAN_TOMCAT_ACCEPT_COUNT:50}

nirikshan:
  web:
    allowed-origin-patterns: ${NIRIKSHAN_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
  auth:
    jwt-secret: ${NIRIKSHAN_JWT_SECRET:change-this-demo-secret-to-a-long-random-value-1234567890}
    jwt-expiry-hours: 24
    admin-seed-email: ${ADMIN_SEED_EMAIL:}
    admin-seed-password: ${ADMIN_SEED_PASSWORD:}
    admin-seed-force-reset: ${ADMIN_SEED_FORCE_RESET:false}
  cv:
    pipeline-dir: ${NIRIKSHAN_CV_PIPELINE_DIR:cv-pipeline}
    python-executable: ${NIRIKSHAN_PYTHON:python}
    risk-event-url: ${NIRIKSHAN_RISK_EVENT_URL:http://localhost:8080/api/risk-events}
    backend-processing-enabled: ${NIRIKSHAN_CV_BACKEND_PROCESSING_ENABLED:false}
  privacy:
    raw-video-retention-hours: ${NIRIKSHAN_RAW_VIDEO_RETENTION_HOURS:0}
    processed-frame-retention-hours: ${NIRIKSHAN_PROCESSED_FRAME_RETENTION_HOURS:24}
    aggregate-event-retention-days: ${NIRIKSHAN_AGGREGATE_EVENT_RETENTION_DAYS:365}
    cleanup-interval-ms: ${NIRIKSHAN_PRIVACY_CLEANUP_INTERVAL_MS:3600000}
  routes:
    default-capacity: ${NIRIKSHAN_ROUTE_DEFAULT_CAPACITY:600}
    main-gate-exit-capacity: ${NIRIKSHAN_MAIN_GATE_EXIT_CAPACITY:450}
  analysis:
    interval-seconds: ${NIRIKSHAN_ANALYSIS_INTERVAL_SECONDS:30}
    flow-min-samples: ${NIRIKSHAN_FLOW_MIN_SAMPLES:3}
    flow-min-span-seconds: ${NIRIKSHAN_FLOW_MIN_SPAN_SECONDS:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:nirikshan;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${PGJDBC_URL:}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${PGUSER:}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${PGPASSWORD:}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: local-postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nirikshan}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${PGUSER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${PGPASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
